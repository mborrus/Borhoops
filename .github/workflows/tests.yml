name: Tests

on:
  push:
    branches: [main, v2]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -e ./CBBpy
          pip install pandas duckdb pyyaml pytest

      - name: Run tests
        run: python -m pytest tests/ -v
